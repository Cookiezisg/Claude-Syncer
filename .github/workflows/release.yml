name: Release

# Push a tag like v0.2.0 to publish a release. The Homebrew tap
# (Cookiezisg/homebrew-tap) picks new releases up by itself, with its own
# token, so this repository needs no credential for it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build universal binary
        run: |
          V="${GITHUB_REF_NAME#v}"
          make dist VERSION="$V" COMMIT="${GITHUB_SHA::7}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes
